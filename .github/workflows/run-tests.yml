name: Tests

on:
   push:
      branches-ignore:
        - 'staging'
        - 'production'

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Set Stripe test placeholders
        run: |
          echo "STRIPE_KEY=pk_test_placeholder" >> .env
          echo "STRIPE_SECRET=sk_test_placeholder" >> .env

      - name: Copy .env to .env.testing
        run: cp .env .env.testing

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

      - name: Show Laravel log
        if: failure()
        run: cat storage/logs/laravel.log || echo "No laravel.log file found"
